[package]
name = "tether-notes"
version = "0.1.5"
description = "Tether Notes desktop shell"
authors = ["Tether Notes"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tether_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true







