name: Supabase keepalive

# Supabase free projects pause after a week without activity. This pings a real
# Postgres query (the shared_note function) once a day so the project stays warm.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/shared_note" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"keepalive"}')
          echo "rest/rpc shared_note -> $status"
          cat /tmp/body.txt
          echo
          test "$status" = "200"

          health=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "auth/v1/health -> $health"
          test "$health" = "200"
